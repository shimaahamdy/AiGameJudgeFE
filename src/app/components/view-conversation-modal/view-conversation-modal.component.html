<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50" (click)="onBackdropClick($event)">
  <div class="max-w-2xl w-full h-[90vh] flex flex-col gap-0 bg-card border border-border rounded-lg shadow-lg m-4">
    <!-- Header -->
    <div class="border-b border-border px-6 py-4 flex-shrink-0">
      <div class="flex items-start justify-between">
        <div class="flex-1">
          <h2 class="text-lg font-semibold text-foreground">
            {{ conversation?.npcName || "Conversation" }}
          </h2>
          <p class="text-sm text-muted-foreground mt-1" *ngIf="conversation">
            Conversation with {{ conversation.npcName }} • Player: {{ conversation.playerName }}
          </p>
        </div>
        <button
          (click)="onClose()"
          class="ml-4 text-muted-foreground hover:text-foreground transition-colors"
          aria-label="Close"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="flex-1 overflow-hidden">
      <div #scrollContainer class="h-full overflow-y-auto p-6 space-y-4">
        <div *ngIf="isLoading" class="flex items-center justify-center py-8">
          <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary"></div>
        </div>

        <div *ngIf="!isLoading && conversation && conversation.messages.length === 0" class="flex items-center justify-center py-8 text-muted-foreground">
          <p>No messages in this conversation.</p>
        </div>

        <div *ngIf="!isLoading && conversation && conversation.messages.length > 0">
          <div
            *ngFor="let message of conversation.messages"
            [class]="'flex ' + (message.sender === 'player' ? 'justify-end' : 'justify-start')"
          >
            <div
              [class]="'max-w-xs lg:max-w-md message-bubble ' + (message.sender === 'player' ? 'message-player-bubble' : 'message-npc-bubble')"
            >
              <p class="text-sm leading-relaxed">{{ message.content }}</p>
              <p
                [class]="'text-xs mt-2 ' + (message.sender === 'player' ? 'text-primary-foreground/70' : 'text-muted-foreground')"
              >
                {{ formatTime(message.timestamp) }}
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="border-t border-border px-6 py-4 flex-shrink-0">
      <p class="text-xs text-muted-foreground text-center mb-3">
        Read-only conversation view
      </p>
      <button
        (click)="onClose()"
        class="w-full px-4 py-2 bg-transparent border border-border rounded-md text-foreground hover:bg-muted transition-colors text-sm font-medium"
      >
        Close
      </button>
    </div>
  </div>
</div>
