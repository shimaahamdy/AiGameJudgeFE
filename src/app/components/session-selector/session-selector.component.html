<div class="mb-8">
  <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
    <div>
      <h2 class="text-sm font-semibold text-muted-foreground uppercase tracking-wide mb-2">
        Session
      </h2>
    </div>
    <div class="w-full sm:w-72">
      <select 
        [value]="selectedSessionId || ''" 
        (change)="onSessionChange($event)"
        class="w-full px-3 py-2 bg-background border border-input rounded-md text-foreground focus:outline-none focus:ring-2 focus:ring-ring"
      >
        <option value="" disabled>Select a session</option>
        <option *ngFor="let session of sessions" [value]="session.id">
          {{ session.name }} - {{ formatDate(session.timestamp) }} • {{ session.playerName }}
        </option>
      </select>
    </div>
  </div>

  <div *ngIf="selectedSession" class="mt-4 p-4 bg-muted/50 rounded-lg border border-border">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <p class="text-xs text-muted-foreground font-medium">Session</p>
        <p class="text-sm font-semibold text-foreground mt-1">
          {{ selectedSession.name }}
        </p>
      </div>
      <div>
        <p class="text-xs text-muted-foreground font-medium">Player</p>
        <p class="text-sm font-semibold text-foreground mt-1">
          {{ selectedSession.playerName }}
        </p>
      </div>
      <div>
        <p class="text-xs text-muted-foreground font-medium">Date</p>
        <p class="text-sm font-semibold text-foreground mt-1">
          {{ formatFullDate(selectedSession.timestamp) }}
        </p>
      </div>
    </div>
  </div>
</div>
