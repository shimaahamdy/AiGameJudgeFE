<section
    class="login-page min-h-screen bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md">
        <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-8">
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-slate-400 mb-6">Sign in to your account to continue</p>

            <form (ngSubmit)="login()" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                    <input [(ngModel)]="email" name="email" type="email" placeholder="you@example.com"
                        class="w-full px-4 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <input [(ngModel)]="password" name="password" [type]="showPassword() ? 'text' : 'password'"
                            placeholder="••••••••"
                            class="w-full px-4 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" />
                        <button type="button" (click)="togglePasswordVisibility()"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                            {{ showPassword() ? '🙈' : '👁️' }}
                        </button>
                    </div>
                </div>

                <div *ngIf="message" class="p-3 rounded bg-slate-700/50 border border-slate-600 text-sm text-slate-300">
                    {{ message }}
                </div>

                <button type="submit" [disabled]="isLoading"
                    class="w-full py-2 rounded-lg bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 disabled:from-slate-600 disabled:to-slate-600 text-white font-semibold transition">
                    {{ isLoading ? 'Signing in...' : 'Sign In' }}
                </button>

                <button type="button" (click)="tryDemo()"
                    class="w-full py-2 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-700/50 font-semibold transition">
                    Try Demo
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-slate-400">
                    Don't have an account?
                    <a routerLink="/register" class="text-blue-400 hover:text-blue-300 font-semibold">Sign up</a>
                </p>
            </div>
        </div>
    </div>
</section>
